# This workflow automatically bumps the version of SNPio based on GitVersion,
# commits changes to the version files, and creates a GitHub release with the new version tag.
name: Auto Version and Tag SNPio Release

on:
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Manually specify a version tag (e.g., 1.5.3). Leave blank to auto-generate.'
        required: false
        default: ''
      complete_existing_release:
        description: 'Complete a stable GitHub release for a verified existing tag without republishing packages.'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  version-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Determine version to use
        id: set_version
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
          MANUAL_TAG: ${{ inputs.manual_tag }}
        run: |
          VERSION="${MANUAL_TAG:-$GITVERSION_SEMVER}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          echo "Using version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Print version
        run: |
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "SemVer:     ${{ steps.set_version.outputs.version }}"
          echo "Tag:        v${{ steps.set_version.outputs.version }}"

      - name: Verify existing release source
        if: inputs.complete_existing_release
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = master
          git rev-parse --verify "refs/tags/v$VERSION"
          git merge-base --is-ancestor "v$VERSION" HEAD
          git diff --exit-code "v$VERSION" HEAD -- \
            snpio ':(exclude)snpio/docs' tests Dockerfile requirements.txt
          test -f "etc/releases/$VERSION.md"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install version update dependencies
        run: python -m pip install tomli-w pyyaml

      - name: Update version in pyproject.toml, meta.yaml, conf.py
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: python scripts/update_versions.py "$VERSION"

      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine

      - name: Run warning-free unit tests
        run: python -m pytest -q

      - name: Build documentation with warnings as errors
        env:
          MPLCONFIGDIR: /tmp/snpio-mpl
          NUMBA_CACHE_DIR: /tmp/snpio-numba
        run: |
          python -m sphinx -E -a -W --keep-going -b html \
            snpio/docs/source /tmp/snpio-docs-html

      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/verify_distributions.py dist/*

      - name: Push version commit and tag atomically
        if: '!inputs.complete_existing_release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml recipe/meta.yaml snpio/docs/source/conf.py
          git commit -m "chore: bump version to ${{ steps.set_version.outputs.version }}"

          if git rev-parse --verify --quiet \
            "refs/tags/v${{ steps.set_version.outputs.version }}"; then
            echo "::error::Tag v${{ steps.set_version.outputs.version }} already exists."
            exit 1
          fi

          git tag "v${{ steps.set_version.outputs.version }}"
          git push --atomic origin \
            HEAD:master "refs/tags/v${{ steps.set_version.outputs.version }}"
          echo "v${{ steps.set_version.outputs.version }}" > .version_tag

      - name: Prepare verified existing release artifacts
        if: inputs.complete_existing_release
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          with urllib.request.urlopen(f"https://pypi.org/pypi/snpio/{version}/json") as response:
              release = json.load(response)
          assert release["info"]["version"] == version
          assert not release["info"]["yanked"]
          assets = Path("release_assets")
          assets.mkdir()
          for artifact in release["urls"]:
              assert not artifact["yanked"]
              filename = artifact["filename"]
              assert Path(filename).name == filename
              with urllib.request.urlopen(artifact["url"]) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == artifact["digests"]["sha256"]
              (assets / filename).write_bytes(data)
              if filename.endswith(".whl"):
                  with zipfile.ZipFile(assets / filename) as wheel:
                      for name in wheel.namelist():
                          if name.startswith("snpio/") and name.endswith(".py") and not name.startswith("snpio/docs/"):
                              assert wheel.read(name) == Path(name).read_bytes(), name
              print(f"Verified existing PyPI artifact: {filename}")
          Path(".version_tag").write_text(f"v{version}\n")
          PY
          python scripts/verify_distributions.py release_assets/*

      - name: Set tag name output
        id: read_tag
        run: echo "tag_name=$(cat .version_tag)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.read_tag.outputs.tag_name }}
          name: Release ${{ steps.read_tag.outputs.tag_name }}
          generate_release_notes: ${{ !inputs.complete_existing_release }}
          body_path: ${{ inputs.complete_existing_release && format('etc/releases/{0}.md', steps.set_version.outputs.version) || '' }}
          files: ${{ inputs.complete_existing_release && 'release_assets/*' || '' }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Dispatch package publishing workflows
        if: '!inputs.complete_existing_release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pypi-docker-publish.yml \
            --ref "${{ steps.read_tag.outputs.tag_name }}"
          gh workflow run conda-publish.yml \
            --ref "${{ steps.read_tag.outputs.tag_name }}"
